name: Deploy no Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Encontra e entra no diretório correto do projeto no Raspberry Pi
            if [ -d "$HOME/apps/diogo_alves_fotografia" ]; then
              cd "$HOME/apps/diogo_alves_fotografia"
            elif [ -d "$HOME/apps/diogo_alves_fotografia" ]; then
              cd "$HOME/apps/diogo_alves_fotografia"
            elif [ -d "$HOME/apps/diogo_alves_fotografia" ]; then
              cd "$HOME/apps/diogo_alves_fotografia"
            else
              echo "❌ Diretório do projeto não encontrado no Raspberry Pi!"
              echo "Procurados: ~/apps/diogo_alves_fotografia, ~/apps/diogo_alves_fotografia, ~/apps/diogo_alves_fotografia"
              exit 1
            fi

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # Carrega o NVM se usar, ou garante acesso aos binários do Node no path do Pi
            
            echo "📥 Atualizando código fonte..."
            git pull origin main
            
            echo "📦 Instalando dependências..."
            npm install --omit=dev # --omit=dev economiza memória no Raspberry Pi 3
            
            echo "🔄 Sincronizando schema do banco..."
            npx prisma generate
            npm run db:push
            
            echo "🏗️ Gerando nova compilação da aplicação..."
            npm run build
            
            echo "🚀 Reiniciando servidor no PM2..."
            pm2 restart "diogo_alves_fotografia"
            
            echo "✅ Deploy finalizado com sucesso!"
